# 운영(prod) 환경 전용 설정
# 실행 시: -Dspring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    # 운영에서는 반드시 .env에서 URL 지정 (기본값 없음)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    # 운영에서는 절대 자동으로 스키마 건드리지 않도록 none
    hibernate:
      ddl-auto: none
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
        default-image: ${DEFAULT_IMAGE_URL} # 기본 프로필 이미지 경로
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      stack:
        auto: false

    openfeign:
      client:
        config:
          solapiClient:
            connectTimeout: 3000
            readTimeout: 5000

solapi:
  base-uri: "https://api.solapi.com"
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  default-from: "${SOLAPI_DEFAULT_FROM}"

# 운영 환경 로그 설정
# - root: INFO → 전체 로그는 INFO 이상
logging:
  level:
    root: INFO
    com.cotato.itda: INFO

jwt:
  access:
    algorithm: HS256
    secret-key: ${JWT_ACCESS_SECRET_BASE64}
    validity-in-seconds: 3600 #1시간

  refresh:
    algorithm: HS256
    secret-key: ${JWT_REFRESH_SECRET_BASE64}
    validity-in-seconds: 1209600 #14일

security:
  jwt:
    secret: ${SPRING_SECURITY_JWT_SECRET}
app:
  websocket:
    allowed-origins: http://localhost:5173,http://localhost:8080, ${FRONTEND_URL}