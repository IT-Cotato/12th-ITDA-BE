name: CD

# develop 브랜치에 push(merge)되면 실행
on:
  push:
    branches:
      - develop

# 테스트 결과 작성을 위해 쓰기권한 추가
permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 캐싱
      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Gradlew 실행 권한 부여
      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      # 5. Gradle 빌드 (테스트 제외)
      - name: Build With Gradle
        run: ./gradlew build -x test

      # 6. Docker 이미지 빌드 & Push
      - name: Docker build & Push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/symtalk-be --push .
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/nginx --push -f dockerfile-nginx .

      # 7. docker-compose.prod.yml을 EC2로 복사
      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/compose/"
          overwrite: true

      # 8. Docker Compose로 배포
      - name: Deploy with Docker compose
        uses: appleboy/ssh-action@master
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          username: ubuntu
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: DB_URL, DB_USERNAME, DB_PASSWORD
          script: |
            cd /home/ubuntu/compose
            sudo docker compose -f docker-compose.prod.yml down
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/symtalk-be
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/nginx
            sudo -E DB_URL=$DB_URL DB_USERNAME=$DB_USERNAME DB_PASSWORD=$DB_PASSWORD docker compose -f docker-compose.prod.yml up -d
