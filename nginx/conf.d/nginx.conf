# HTTP 요청을 HTTPS로 리다이렉트
server {
    listen 80;
    server_name 43.202.184.232.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 43.202.184.232.nip.io;

    ssl_certificate /etc/letsencrypt/live/43.202.184.232.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.202.184.232.nip.io/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://symtalk-be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
